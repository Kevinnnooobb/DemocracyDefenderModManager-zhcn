name: Sync upstream releases

on:
  workflow_dispatch:
  schedule:
    # Check the upstream repository every six hours.
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Fetch upstream branches and tags
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/katsyk/DemocracyDefenderModManager.git
          git fetch --prune upstream main --tags

      - name: Merge upstream main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit upstream/main
          git push origin HEAD:main

      - name: Push the newest upstream release tag
        run: |
          set -euo pipefail
          latest_tag=$(git ls-remote --tags --refs upstream 'v*' | awk -F/ '{print $3}' | sort -V | tail -n1)
          if [ -z "$latest_tag" ]; then
            echo "No upstream v* release tag was found."
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$latest_tag" >/dev/null 2>&1; then
            echo "$latest_tag is already present in the fork."
          else
            git push origin "refs/tags/$latest_tag"
            echo "Pushed $latest_tag; the build workflow will publish the release."
          fi
